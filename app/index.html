<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}</style>
<meta name="description" content="The who's who of yacht racing: the people, teams, clubs, sponsors and events of the sport, and how they connect.">
<title>The Dark Blue Book</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one working screen. A chart table (the graph) with a reference page beside it, like a pilot book open next to the chart. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#0e1d3a; --muted:#566381; --line:#d3dae8; --wash:#e3e8f2;
  --navy:#12264d; --on-navy:#f2f5fb;
  --t-person:#12806c; --t-team:#1d5fc4; --t-club:#8a6a3b; --t-event:#3a4f80; --t-venue:#2f8a3d; --t-class:#7a52a8; --t-record:#c2379a; --t-entry:#6b7896; --t-org:#56627c; --t-sponsor:#b07a08; --t-supplier:#3f7f97; --t-media:#b4532a; --t-owner:#a63a55;
  --c-own:#a63a55; --c-spon:#b07a08; --c-ppl:#12806c; --c-str:#9aa6bf;
  --warn:#9a5b00; --warn-bg:#fbefd6; --danger:#a3243b;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#091228; --surface:#0f1c3b; --ink:#e8edf9; --muted:#93a2c2; --line:#22335c; --wash:#16264b;
  --navy:#050c1d; --on-navy:#e8edf9;
  --t-person:#45c2a9; --t-team:#6ea4ff; --t-club:#d9b98a; --t-event:#b9c6e6; --t-venue:#7fd08a; --t-class:#b592e6; --t-record:#f08ad0; --t-entry:#8e9bbb; --t-org:#a9b4cc; --t-sponsor:#e3b040; --t-supplier:#6fb8d2; --t-media:#f0986b; --t-owner:#e87a95;
  --c-own:#e87a95; --c-spon:#e3b040; --c-ppl:#45c2a9; --c-str:#44557f;
  --warn:#f0c26a; --warn-bg:#3a2c0c; --danger:#ff8fa3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#091228; --surface:#0f1c3b; --ink:#e8edf9; --muted:#93a2c2; --line:#22335c; --wash:#16264b;
  --navy:#050c1d; --on-navy:#e8edf9;
  --t-person:#45c2a9; --t-team:#6ea4ff; --t-club:#d9b98a; --t-event:#b9c6e6; --t-venue:#7fd08a; --t-class:#b592e6; --t-record:#f08ad0; --t-entry:#8e9bbb; --t-org:#a9b4cc; --t-sponsor:#e3b040; --t-supplier:#6fb8d2; --t-media:#f0986b; --t-owner:#e87a95;
  --c-own:#e87a95; --c-spon:#e3b040; --c-ppl:#45c2a9; --c-str:#44557f;
  --warn:#f0c26a; --warn-bg:#3a2c0c; --danger:#ff8fa3; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--t-team);outline-offset:2px}

.top{background:var(--navy);color:var(--on-navy);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;margin:0;letter-spacing:.005em}
.brand span{font-size:12px;opacity:.75;letter-spacing:.04em}
.lens{display:flex;border:1px solid color-mix(in srgb,var(--on-navy) 35%,transparent);border-radius:999px;overflow:hidden}
.lens button{background:none;border:0;padding:6px 14px;color:var(--on-navy);cursor:pointer;font-size:13px}
.lens button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy);font-weight:600}
#scope{padding:6px 10px;border-radius:6px;border:1px solid color-mix(in srgb,var(--on-navy) 35%,transparent);background:var(--navy);color:var(--on-navy);font-size:13px;max-width:165px}
.when{display:flex;align-items:center;gap:8px;font-size:13px}
.when label{flex-direction:row;color:var(--on-navy);opacity:.75;font-size:12px}
.when input{width:120px;accent-color:var(--on-navy)}
.when output{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:4ch}
.when button{background:none;border:1px solid color-mix(in srgb,var(--on-navy) 35%,transparent);border-radius:999px;padding:5px 12px;color:var(--on-navy);cursor:pointer;font-size:13px}
.when button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy);font-weight:600}
.when.off input,.when.off output,.when.off label{opacity:.35}
ul.rel li.past{opacity:.55}
ul.rel li.soon .rl::after{content:'Upcoming';margin-left:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.grp summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding:6px 0}
.grp summary::-webkit-details-marker{display:none}
.grp summary b{width:14px;border-top:2px solid}
.grp summary::after{content:'+';margin-left:auto;font-size:15px;color:var(--muted)}.grp[open] summary::after{content:'\2212'}
.grp .cnt{color:var(--muted);font-weight:500;letter-spacing:0}
.grp[open] summary{margin-bottom:6px}
.tld summary{cursor:pointer;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding:4px 0}
.tld[open] summary{margin-bottom:8px}
.tl{display:flex;flex-direction:column;gap:7px}
.tl .ax{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}
.tl .r{display:grid;gap:3px;min-width:0}
.tl .r span{font-size:12px}
.tl .trk{height:7px;background:var(--wash);border-radius:2px;position:relative;overflow:hidden}
.tl .trk i{position:absolute;top:0;bottom:0;border-radius:2px}
.find{position:relative;flex:0 1 210px;min-width:160px}
.combo{position:relative}.combo-q{width:100%}
.combo-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 2px);margin:0;padding:4px 0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgb(0 0 0/.15);max-height:290px;overflow-y:auto}
.combo-list li{padding:7px 10px;cursor:pointer;font-size:13.5px;color:var(--ink)}.combo-list li.on,.combo-list li:hover{background:var(--wash)}
.combo-list li.none{color:var(--muted);cursor:default}
.filters{display:contents}
.filters-btn,.mapsize{display:none}
.find input{width:100%;padding:7px 12px;border-radius:6px;border:1px solid color-mix(in srgb,var(--on-navy) 35%,transparent);background:color-mix(in srgb,var(--on-navy) 10%,transparent);color:var(--on-navy)}
.find input::placeholder{color:var(--on-navy);opacity:.6}
.hits{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;list-style:none;margin:0;padding:4px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.hits button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px;cursor:pointer}
.hits button:hover,.hits button:focus-visible{background:var(--wash)}
.hits small{color:var(--muted);margin-left:auto}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,45%) minmax(0,1fr)}
.chart{position:relative;min-width:0;min-height:0;overflow:hidden}
#g{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#g:active{cursor:grabbing}
.lk{fill:none;stroke-width:1.3;opacity:.75}
.lk.own{stroke:var(--c-own)} .lk.spon{stroke:var(--c-spon)} .lk.ppl{stroke:var(--c-ppl)} .lk.str{stroke:var(--c-str)}
.lk.unsrc{stroke-dasharray:4 4}
.lk.mem{stroke-dasharray:.5 3.5;stroke-linecap:round;stroke-width:1.8}
.nd.mem circle{stroke:var(--ink);stroke-dasharray:2 2;stroke-width:1.2}
.chip.mem{color:var(--t-person);border-color:currentColor}
.mdot{display:inline-block;width:18px;border-top:2px dotted var(--muted);vertical-align:middle;margin-right:5px}
#memtog{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#pf-roles{display:flex;flex-direction:column;gap:10px}#pf-roles h3{margin:0}
li.editing{display:block!important}.addrole{border:1px solid var(--line);border-radius:6px;padding:12px}.addrole h3{margin:0}
.lk.dim{opacity:.07} .lk.hot{stroke-width:2.2;opacity:1}
.nd{cursor:pointer}
.nd circle{stroke:var(--bg);stroke-width:1.5}
.nd.person circle{fill:var(--t-person)} .nd.team circle{fill:var(--t-team)} .nd.club circle{fill:var(--t-club)} .nd.event circle{fill:var(--t-event)} .nd.venue circle{fill:var(--t-venue)} .nd.class circle{fill:var(--t-class)} .nd.record circle{fill:var(--t-record)} .nd.entry circle{fill:var(--t-entry)} .nd.org circle{fill:var(--t-org)} .nd.sponsor circle{fill:var(--t-sponsor)} .nd.supplier circle{fill:var(--t-supplier)} .nd.media circle{fill:var(--t-media)} .nd.owner circle{fill:var(--t-owner)}
.nd.edition circle{fill:var(--t-edition)} .nd.media circle{fill:var(--t-media)} .nd.host circle{fill:var(--t-host)} .nd.club circle{fill:var(--t-club)} .nd.record circle{fill:var(--t-record)} .nd.org circle{fill:var(--t-org)} .nd.brand circle{fill:var(--t-brand)} .nd.investor circle{fill:var(--t-investor)} .nd.class circle{fill:var(--t-class)} .nd.supplier circle{fill:var(--t-supplier)}
.nd text{font-family:var(--ui);font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none;display:none}
.nd.lab text{display:block}
.nd.dim{opacity:.13}
.nd.sel circle{stroke:var(--ink);stroke-width:2.5}
.nd:focus-visible{outline:none} .nd:focus-visible circle{stroke:var(--ink);stroke-width:2.5}
.legend{position:absolute;left:16px;bottom:12px;right:16px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend b{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:5px;vertical-align:3px}
.legend b.dash{border-top-style:dashed;border-color:var(--muted)}
.blank{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.blank p{max-width:38ch;font-family:var(--display);font-size:19px;margin:0}

aside{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:18px;order:-1}
aside>*{width:100%;max-width:720px}
.kind{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kind i{width:9px;height:9px;border-radius:50%}
.kind .sec{letter-spacing:.04em;text-transform:none;font-size:12px}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}.checks label{flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:13px}.checks input{width:auto}
.kind .cc{font-family:var(--mono);letter-spacing:.06em;margin-left:auto;color:var(--ink);border:1px solid var(--line);padding:1px 6px;border-radius:3px}
h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.12;margin:4px 0 0;text-wrap:balance}
.note{color:var(--muted);margin:6px 0 0}
.claim{font-size:12px;color:var(--muted);margin:8px 0 0}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:7px}
h3 b{width:14px;border-top:2px solid}
ul.rel{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.rel li{padding:9px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
.rl{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.role{color:var(--muted)}
.ent{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ent:hover{text-decoration-color:currentColor}
.meta{grid-column:1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.meta a{color:inherit}
.chip{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 6px;font-size:11px;font-weight:500}
.mini{grid-column:2;grid-row:1 / span 2;align-self:start;background:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.mini:hover{color:var(--ink);border-color:var(--muted)}
.feat .big{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15;margin:4px 0 2px;text-decoration-thickness:1px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.chips li{font-size:13.5px}
.sub{font-size:12px;color:var(--muted);margin:10px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.stats div{border-top:2px solid var(--ink);padding-top:6px}
.stats dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.lede{font-family:var(--display);font-size:17px;line-height:1.4;margin:0;max-width:44ch}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--wash);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn.go{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.bad{color:var(--danger)}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label input,label select,label textarea{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-size:14px;width:100%}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.msg{background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:5px;font-size:13px}

.menu-btn{display:none;background:none;border:1px solid color-mix(in srgb,var(--on-navy) 35%,transparent);border-radius:6px;color:var(--on-navy);padding:6px 9px;cursor:pointer;line-height:0}
.menu{position:absolute;z-index:10;right:16px;top:56px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .25);padding:6px;display:flex;flex-direction:column;min-width:190px}
.menu a{color:inherit;text-decoration:none;padding:10px 12px;border-radius:5px}.menu a:hover,.menu a:focus-visible{background:var(--wash)}
.menu small{padding:8px 12px 4px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.foot{background:var(--navy);color:var(--on-navy);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 20px;font-size:12.5px}
.foot a{color:inherit;opacity:.85;text-decoration:none}.foot a:hover{opacity:1;text-decoration:underline}
.foot span{margin-left:auto;opacity:.6}
.acct{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;opacity:.85;text-align:left}.acct:hover{opacity:1;text-decoration:underline}
.menu .acct{padding:10px 12px;border-radius:5px;opacity:1}.menu .acct:hover{background:var(--wash);text-decoration:none}
.who{font-size:12.5px;color:var(--muted);margin:0}
.guide{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.guide .say{font-family:var(--display);font-size:16px;line-height:1.35;margin:0;color:var(--ink)}
.guide .warn{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.sugg button{background:var(--wash);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.sugg button:hover{border-color:var(--muted)}
.chg h3 .cnt{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.chg .meta .by{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
/* section headings: larger, on a grey band */
h3,.grp summary,.tld summary{font-size:13px;letter-spacing:.07em;background:var(--wash);padding:8px 10px;border-radius:5px;margin:0 0 8px}
.grp[open] summary,.tld[open] summary{margin-bottom:8px}
.grp summary b,h3 b{width:16px;border-top-width:3px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
ul.rel li.rep{display:block}
.rmsg{white-space:pre-wrap;margin:6px 0 8px;overflow-wrap:anywhere}
.rep .acts .btn{padding:3px 10px;font-size:12.5px}
.top{position:relative}
.join{display:flex;align-items:center;gap:14px;order:9}
.join .apply{background:var(--on-navy);color:var(--navy);border:0;border-radius:999px;padding:6px 16px;font-weight:600;cursor:pointer}
.join .apply:hover{opacity:.9}.join .sm{display:none}
.join .acct{white-space:nowrap;max-width:14ch;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12px;color:var(--muted)}
fieldset.roleset{border:1px solid var(--line);border-radius:6px;padding:10px 12px 12px;margin:0 0 10px;display:flex;flex-direction:column;gap:10px}
fieldset.roleset legend{font-size:12px;color:var(--muted);padding:0 4px;display:flex;gap:10px;align-items:baseline}
.orgstate{margin:-6px 0 0;font-size:12px}.orgstate:empty{display:none}
.linky{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.match{background:var(--wash);border-radius:6px;padding:10px 12px;font-size:13px}.match p{margin:0 0 6px}
.match.warn{background:var(--warn-bg);color:var(--warn)}
.match ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.match li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
dl.appl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}dl.appl dt{color:var(--muted);font-size:12px;padding-top:1px}dl.appl dd{margin:0;overflow-wrap:anywhere}
.checks.col{flex-direction:column;gap:8px}.checks.col label{align-items:baseline;flex-wrap:wrap}
input.inline{width:12ch;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px}
label.inl{flex-direction:row;align-items:baseline;gap:8px;color:var(--ink);font-size:13.5px}label.inl input{width:auto}
li.rvrole{display:flex!important;flex-direction:column;gap:8px}
a.btn{text-decoration:none;color:inherit}a.btn.go{color:var(--surface)}
@media (min-width:861px){.join{margin-left:auto}}
.btn.wait{opacity:.6;cursor:progress}
.news{border-left:3px solid var(--t-team);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}.news h3{margin:0 0 2px}.news a{font-weight:600;color:var(--ink);overflow-wrap:anywhere}.news .who{margin:0}
.logo{display:block;width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;flex:none}
.logo.big{width:112px;height:112px}
.logo.ph{display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--bg);border-style:dashed;padding:0}
.av{display:block;width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:var(--wash)}
.av.big{width:112px;height:112px}
.av.ph{display:grid;place-items:center;color:color-mix(in srgb,var(--muted) 45%,transparent);border:2px dashed var(--line);background:var(--bg)}
.av.ph svg{width:62%;height:62%}
.prof{display:flex;gap:14px;align-items:flex-start}.pbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.badge{align-self:flex-start;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--t-person);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.pbio{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.plinks{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}.plinks a{color:var(--t-team)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function(){
/* one save at a time: on a slow connection, a form stays locked while its save (and the reload after it) is under way,

let inflight=0;const _fetch=window.fetch.bind(window);

  f.dataset.busy='1';const btns=[...f.querySelectorAll('button:not([type=button])')].filter(b=>!b.disabled);btns.forEach(b=>{b.disabled=true;b.classList.add('wait')});
  const check=()=>{if(!f.isConnected)return;if(inflight>0)return setTimeout(check,250);delete f.dataset.busy;btns.forEach(b=>{if(b.classList.contains('wait')){b.disabled=false;b.classList.remove('wait')}})};
  setTimeout(check,400)},true);
if(location.hostname!=='app.darkbluebook.com'){document.title='[Preview] '+document.title;const v=document.getElementById('ver');if(v)v.insertAdjacentHTML('afterend','<small style="margin-left:8px;background:#e3b040;color:#12264d;border-radius:3px;padding:0 6px;font-weight:600;letter-spacing:.06em">PREVIEW</small>')}
const TYPES={person:'Person',team:'Team',club:'Yacht club',org:'Organisation',event:'Event',entry:'Entry',class:'Boat class',venue:'Venue',record:'Record'};
const LEVELS={series:'Series',event:'Event',edition:'Edition',round:'Round'};
const SECTORS=['sponsor','supplier','owner','media','agency','organiser','governing body','class association','industry body','public body','nonprofit','other'];
const LEGACY={series:{type:'event',level:'series'},edition:{type:'event',level:'edition'},host:{type:'venue'},brand:{type:'org',sectors:['sponsor']},supplier:{type:'org',sectors:['supplier']},media:{type:'org',sectors:['media']},investor:{type:'org',sectors:['owner']}};
const COLOURED=['sponsor','supplier','owner','media'];
function norm(e){const g=LEGACY[e.type];if(g){e.legacyType=e.legacyType||e.type;e.type=g.type;if(g.level&&!e.level)e.level=g.level;if(g.sectors&&!(e.sectors||[]).length)e.sectors=g.sectors.slice()}
  if(!TYPES[e.type])e.type='org';e.sectors=Array.isArray(e.sectors)?e.sectors:[];e.level=e.type==='event'?(LEVELS[e.level]?e.level:'event'):'';return e}
const ck=e=>e.type==='org'?(COLOURED.find(s=>e.sectors.includes(s))||'org'):e.type;
const kindLabel=e=>e.type==='event'&&e.level&&e.level!=='event'?LEVELS[e.level]:TYPES[e.type];
const COUNTRIES='ARG Argentina|ATG Antigua and Barbuda|AUS Australia|AUT Austria|BAH Bahamas|BEL Belgium|BER Bermuda|BRA Brazil|CAN Canada|CHI Chile|CHN China|CRO Croatia|CYP Cyprus|DEN Denmark|ESP Spain|EST Estonia|FIN Finland|FRA France|GBR Great Britain|GER Germany|GRE Greece|HKG Hong Kong|IRL Ireland|ISR Israel|ITA Italy|JPN Japan|KOR South Korea|KSA Saudi Arabia|MEX Mexico|MLT Malta|MON Monaco|NED Netherlands|NOR Norway|NZL New Zealand|OMA Oman|POL Poland|POR Portugal|QAT Qatar|RSA South Africa|SGP Singapore|SUI Switzerland|SVN Slovenia|SWE Sweden|THA Thailand|TUR Turkey|UAE United Arab Emirates|URU Uruguay|USA United States'.split('|').map(x=>[x.slice(0,3),x.slice(4)]);
const CATS={own:'Ownership',spon:'Commercial',ppl:'People',str:'Structure'};
const ROLES=['owner','co-owner','majority owner','minority owner','investor','backer','co-founder','title partner','presenting partner','main partner','partner','supplier','driver','skipper','helm','team principal','defender','challenger','wing trimmer','strategist','crew','CEO','coach','competes in','round of','set','ratified','organiser','represents','host city','stopover host','finish host','broadcast partner','production partner','commentator','journalist'];
const LENS={all:null,money:['own','spon'],people:['ppl']};
let E=new Map(),L=[],sel=null,lens='all',mode='view',editing=null,canEdit=false,db=null,loaded={e:false,l:false},msg='',zk=1;
let AUDIT=[],auditAll=false;
let rkind='error',rlink='',REPORTS=[],openReports=0,showDone=false,uid='';
const $=s=>document.querySelector(s),panel=$('#panel');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tvar=e=>'var(--t-'+ck(e)+')';
const byName=()=>[...E.values()].sort((a,b)=>a.name.localeCompare(b.name));

/* ---------- graph ---------- */
const svg=d3.select('#g'),root=svg.append('g'),linkG=root.append('g'),nodeG=root.append('g');
let nodes=[],links=[],pos=new Map(),needFit=true;
const NOW=new Date().getFullYear();let year=NOW,allTime=false,scope='';
function core(){if(!scope||!E.has(scope))return null;const s=new Set([scope]);let grew=true;while(grew){grew=false;L.forEach(l=>{if(l.cat==='str'&&s.has(l.to)&&!s.has(l.from)){s.add(l.from);grew=true}})}return s}
const YR_FLOOR=2010; // earliest year on the slider; older links still show under All time
const yr=s=>{const m=/^(\d{4})/.exec(s||'');return m?+m[1]:null};
const ended=l=>!allTime&&yr(l.end)!=null&&yr(l.end)<year,ahead=l=>!allTime&&yr(l.start)!=null&&yr(l.start)>year;
let MAXY=NOW;
function active(l){if(allTime)return true;const a=yr(l.start),b=yr(l.end);if(a==null&&b==null)return year===NOW;return(a==null||a<=year)&&(b==null||b>=year)}
const zoom=d3.zoom().scaleExtent([.25,5]).on('zoom',e=>{root.attr('transform',e.transform);zk=e.transform.k;paint()});
svg.call(zoom).on('click',e=>{if(e.target===svg.node())pick(null)});
const sim=d3.forceSimulation()
  .force('link',d3.forceLink().id(d=>d.id).distance(d=>d.cat==='str'?80:48).strength(.45))
  .force('charge',d3.forceManyBody().strength(-280))
  .force('x',d3.forceX().strength(.05)).force('y',d3.forceY().strength(.08))
  .force('collide',d3.forceCollide(d=>d.r+7)).on('tick',tick);
/* glide the map to an entry picked from a link, search or the address, unless it's already well in view */
let centerTimer=null;
function centerSoon(id,delay){clearTimeout(centerTimer);centerTimer=setTimeout(()=>centerOn(id),delay==null?80:delay)}
function centerOn(id){const n=nodes.find(x=>x.id===id);if(!n||n.x==null)return;
  const vb=svg.node().viewBox.baseVal,w=vb&&vb.width||0,h=vb&&vb.height||0;if(!w||!h)return;
  const t=d3.zoomTransform(svg.node()),[sx,sy]=t.apply([n.x,n.y]);
  if(Math.abs(sx)<w*.3&&Math.abs(sy)<h*.3)return;
  const k=Math.max(t.k,.8);
  svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(-n.x*k,-n.y*k).scale(k))}
function size(){const b=$('.chart').getBoundingClientRect();if(b.width&&b.height)svg.attr('viewBox',[-b.width/2,-b.height/2,b.width,b.height].join(' '))}
window.addEventListener('resize',size);
if(window.ResizeObserver)new ResizeObserver(()=>size()).observe(document.querySelector('.chart'));
/* phones: expand the map to the full screen and back; show or hide the filters */
function showPanel(){panel.scrollTop=0;if(window.matchMedia('(max-width:860px)').matches)setMapFull(false)}
function setMapFull(on){const m=document.querySelector('main'),b=document.getElementById('mapsize');if(!m||!b)return;m.classList.toggle('mapfull',on);b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?'Show details':'Expand map';size()}
document.getElementById('mapsize').addEventListener('click',()=>setMapFull(!document.querySelector('main').classList.contains('mapfull')));
document.getElementById('filtersBtn').addEventListener('click',e=>{const t=document.querySelector('.top'),on=!t.classList.contains('showf');t.classList.toggle('showf',on);e.currentTarget.setAttribute('aria-expanded',on?'true':'false')});size();

function visibleLinks(){const c=LENS[lens],k=core();return L.filter(l=>E.has(l.from)&&E.has(l.to)&&active(l)&&(showMember||(l.origin!=='member'&&E.get(l.from).origin!=='member'&&E.get(l.to).origin!=='member'))&&(!c||c.includes(l.cat))&&(!k||k.has(l.from)||k.has(l.to)))}
function build(){
  nodes.forEach(n=>pos.set(n.id,{x:n.x,y:n.y}));
  const vl=visibleLinks(),deg=new Map();
  L.filter(active).forEach(l=>{deg.set(l.from,(deg.get(l.from)||0)+1);deg.set(l.to,(deg.get(l.to)||0)+1)});
  const keep=new Set();vl.forEach(l=>{keep.add(l.from);keep.add(l.to)});
  nodes=[...E.values()].filter(e=>(showMember||e.origin!=='member')&&((lens==='all'&&allTime&&!scope)||keep.has(e.id))).map(e=>{const p=pos.get(e.id)||{},d=deg.get(e.id)||0;
    return {id:e.id,name:e.name,type:e.type,level:e.level,ck:ck(e),mem:e.origin==='member',kl:kindLabel(e),deg:d,r:(e.level==='series'?9:(e.level==='edition'||e.level==='round')?7:4.5)+Math.sqrt(d)*2.3,x:p.x,y:p.y}});
  const pairs=new Map();
  links=vl.map(l=>{const k=[l.from,l.to].sort().join('|'),a=pairs.get(k)||[];const o={id:l.id,mem:l.origin==='member',tip:E.get(l.from).name+' \u00b7 '+l.role+' \u00b7 '+E.get(l.to).name+(l.origin==='member'?' (added by member)':l.source?'':' (unverified)'),source:l.from,target:l.to,cat:CATS[l.cat]?l.cat:'str',unsrc:!l.source,i:a.length,grp:a};a.push(o);pairs.set(k,a);return o});
  linkG.selectAll('path').data(links,d=>d.id).join(en=>{const q=en.append('path');q.append('title');return q}).select('title').text(d=>d.tip);
  const n=nodeG.selectAll('g.nd').data(nodes,d=>d.id).join(en=>{
    const g=en.append('g').attr('class','nd').attr('tabindex',0).attr('role','button');
    g.append('circle');g.append('text').attr('dy','.32em');
    g.on('click',(e,d)=>{e.stopPropagation();pick(d.id)}).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(d.id)}});
    g.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
    return g});
  n.attr('aria-label',d=>d.name+', '+d.kl);
  n.select('circle').attr('r',d=>d.r);
  n.select('text').attr('x',d=>d.r+4).text(d=>d.name);
  sim.nodes(nodes);sim.force('link').links(links);sim.alpha(pos.size? .35:1).restart();
  $('#blank').hidden=nodes.length>0;
  if(!nodes.length)$('#blank').firstElementChild.textContent=!db?'The book can’t be opened in this view. Sign in to see the map.':(loaded.e&&loaded.l)?(E.size?'Nothing recorded for this year through this lens.':'Nothing in the book yet. Use New entry to add the first one.'):'Opening the book…';
  paint();boot();
}
function tick(){
  linkG.selectAll('path').attr('d',d=>{const s=d.source,t=d.target;if(s.x==null||t.x==null)return'';
    const flip=s.id>t.id?-1:1,dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy)||1,off=(d.i-(d.grp.length-1)/2)*16*flip;
    return`M${s.x},${s.y}Q${(s.x+t.x)/2-dy/len*off},${(s.y+t.y)/2+dx/len*off} ${t.x},${t.y}`});
  nodeG.selectAll('g.nd').attr('transform',d=>`translate(${d.x},${d.y})`);
  if(needFit&&sim.alpha()<.1){needFit=false;fit()}
}
function fit(){if(!nodes.length)return;const b=$('.chart').getBoundingClientRect(),xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.max(.25,Math.min(1.3,(b.width-90)/((x1-x0)||1),(b.height-110)/((y1-y0)||1)));
  svg.transition().duration(matchMedia('(prefers-reduced-motion:reduce)').matches?0:500).call(zoom.transform,d3.zoomIdentity.scale(k).translate(-(x0+x1)/2,-(y0+y1)/2-10/k))}
function paint(){
  const near=new Set();if(sel){near.add(sel);links.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;if(s===sel)near.add(t);if(t===sel)near.add(s)})}
  nodeG.selectAll('g.nd').attr('class',d=>'nd '+d.ck+(d.mem?' mem':'')+(d.id===sel?' sel':'')+(sel&&!near.has(d.id)?' dim':'')+
    ((sel?near.has(d.id):(d.level==='series'||d.level==='edition'||d.type==='team'||d.deg>=5||zk>1.6))?' lab':''));
  linkG.selectAll('path').attr('class',d=>{const s=d.source.id||d.source,t=d.target.id||d.target,h=sel&&(s===sel||t===sel);
    return'lk '+d.cat+(d.mem?' mem':d.unsrc?' unsrc':'')+(sel?(h?' hot':' dim'):'')});
}
function pick(id,fromHash){sel=id&&E.has(id)?id:null;mode='view';editing=null;msg='';paint();render();if(!fromHash)syncHash();
  if(sel&&window.matchMedia('(max-width:860px)').matches){panel.scrollTop=0;setMapFull(false)}
  if(sel)centerSoon(sel,fromHash?900:80)}

/* ---------- overview: featured, in the news ---------- */
let FEAT=[];
function featured(){
  const f=FEAT.find(x=>x.slot==='featured'&&E.has(x.entity_id));if(!f)return'';const e=E.get(f.entity_id);
  const mine=L.filter(l=>(l.from===e.id||l.to===e.id)&&E.has(l.from)&&E.has(l.to));
  const other=l=>E.get(l.from===e.id?l.to:l.from);
  const rank=r=>/title|major|naming|principal/i.test(r)?0:/main|presenting|premium|global/i.test(r)?1:/official/i.test(r)?2:3;
  const group=(cat,label,max)=>{const r=mine.filter(l=>l.cat===cat).sort((a,b)=>rank(a.role)-rank(b.role)||other(a).name.localeCompare(other(b).name));if(!r.length)return'';
    return`<p class="sub">${label}</p><ul class="chips">${r.slice(0,max).map(l=>`<li><button type="button" class="ent" data-go="${esc(other(l).id)}">${esc(other(l).name)}</button> <span class="role">${esc(l.role)}</span></li>`).join('')}${r.length>max?`<li><button type="button" class="ent" data-go="${esc(e.id)}">+${r.length-max} more</button></li>`:''}</ul>`};
  return`<section class="feat"><h3><b style="border-color:var(--c-spon)"></b>Featured</h3>
    <div class="kind"><i style="background:${tvar(e)}"></i>${esc(kindLabel(e))}</div>
    <button type="button" class="ent big" data-go="${esc(e.id)}">${esc(e.name)}</button>
    ${f.headline||e.note?`<p class="note">${esc(f.headline||e.note)}</p>`:''}
    ${group('spon','Partners',8)}${group('ppl','People',6)}</section>`}
function inTheNews(){
  const r=FEAT.filter(x=>x.slot==='news'&&E.has(x.entity_id)).sort((a,b)=>a.position-b.position);if(!r.length)return'';
  return`<section><h3><b style="border-color:var(--c-own)"></b>In the news</h3><ul class="rel">${r.map(x=>{const e=E.get(x.entity_id);
    return`<li><div class="rl"><button type="button" class="ent" data-go="${esc(e.id)}">${esc(e.name)}</button></div>${x.headline?`<div class="meta"><span>${esc(x.headline)}</span>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">read ↗</a>`:''}</div>`:''}</li>`}).join('')}</ul></section>`}

/* ---------- deep links ---------- */
let booted=false;
function syncHash(){const want=sel?'#'+encodeURIComponent(sel):'';if(location.hash===want)return;try{history.pushState(null,'',want||location.pathname+location.search)}catch(e){}}
function reveal(id){if(!E.has(id))return false;if(nodes.some(n=>n.id===id))return true;

async function loadAudit(){try{AUDIT=await apiGet('audit_log?select=id,table_name,row_id,action,old_row,new_row,changed_by,changed_at&table_name=in.(entities,links)&order=id.desc&limit=40')}catch(e){AUDIT=[]}}
const SKIP=new Set(['updated_at','created_at','legacy_type']);
const FIELD={name:'name',type:'kind',sectors:'sectors',level:'level',country:'country',note:'note',status:'status',from_id:'who',to_id:'of',role:'role',cat:'kind of link',context_id:'applies in',start_date:'from',end_date:'until',source:'source',id:'id'};
function changes(){if(!AUDIT.length)return'';const ago=d=>{const m=Math.round((Date.now()-new Date(d))/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
  const nm=id=>E.has(id)?E.get(id).name:id;
  const item=a=>{const r=a.new_row||a.old_row||{},gone=a.action==='DELETE';
    let what;if(a.table_name==='entities'){const lbl=gone||!E.has(a.row_id)?`<strong>${esc(r.name||a.row_id)}</strong>`:`<button type="button" class="ent" data-go="${esc(a.row_id)}">${esc(r.name||nm(a.row_id))}</button>`;what=lbl+` <span class="role">entry</span>`}
    else{const f=r.from_id,t=r.to_id;what=`${E.has(f)&&!gone?`<button type="button" class="ent" data-go="${esc(f)}">${esc(nm(f))}</button>`:`<strong>${esc(nm(f))}</strong>`} <span class="role">${esc(r.role||'')}</span> ${esc(nm(t))}`}
    let verb=a.action==='INSERT'?'Added':gone?'Deleted':'Edited';
    if(a.action==='UPDATE'&&a.old_row&&a.new_row){const ch=Object.keys(a.new_row).filter(k=>!SKIP.has(k)&&JSON.stringify(a.new_row[k])!==JSON.stringify(a.old_row[k])).map(k=>FIELD[k]||k);if(ch.length)verb+=': '+ch.join(', ')}
    return`<li><div class="rl">${what}</div><div class="meta"><span>${esc(verb)}</span><span>${ago(a.changed_at)}</span><span class="by">${a.changed_by?'app':'intake'}</span></div></li>`};
  const list=auditAll?AUDIT:AUDIT.slice(0,10);
  return`<section class="chg"><h3><b style="border-color:var(--ink)"></b>Latest changes <span class="cnt">editors only</span></h3><ul class="rel">${list.map(item).join('')}</ul>${AUDIT.length>10?`<div class="acts" style="margin-top:8px"><button type="button" class="btn" data-auditall="1">${auditAll?'Show fewer':'Show last '+AUDIT.length}</button></div>`:''}</section>`}

function formReport(){const e=rkind==='error'&&sel?E.get(sel):null;if(rkind==='error'&&!e)rkind='feedback';
  const mine=e?L.filter(l=>(l.from===sel||l.to===sel)&&E.has(l.from)&&E.has(l.to)).sort((a,b)=>linkLabel(a,sel).localeCompare(linkLabel(b,sel))):[];
  panel.innerHTML=`<form id="fr"><h2>${e?'Report an error':'Send feedback'}</h2>
    <div class="msg" id="fr-box" hidden></div>
    ${e?`<p class="note">On <strong>${esc(e.name)}</strong>. Tell us what’s wrong and, if you can, where the right information is published.</p>
    <label>What’s wrong<select id="fr-link">${opt('','The entry itself (name, kind, country, note)',rlink)}${mine.length?'<option disabled>──────────</option>':''}${mine.map(l=>opt(l.id,linkLabel(l,sel),rlink)).join('')}</select></label>`
      :`<p class="note">Something missing, wrong or annoying? Ideas welcome too. It goes straight to the editors.</p>`}
    <label>${e?'Details':'Your feedback'}<textarea id="fr-msg" rows="5" required minlength="3" maxlength="2000"></textarea></label>
    <div class="two"><label>Your name (optional)<input id="fr-name" maxlength="120" autocomplete="name" value="${esc(ME&&ME.name||'')}"></label>
    <label>Your email<input id="fr-email" type="email" required maxlength="200" autocomplete="email" value="${esc(who)}"></label></div>
    <label class="hp" aria-hidden="true">Leave this empty<input id="fr-web" tabindex="-1" autocomplete="off"></label>
    <p class="who">We use your email only to reply about this. See the <a href="privacy.html" target="_blank" rel="noopener">privacy notice</a>.</p>
    <div class="acts"><button class="btn go" id="fr-send">Send</button><button type="button" class="btn" data-cancel="1">Cancel</button></div></form>`;
  document.getElementById('fr-msg').focus({preventScroll:true})}
async function sendReport(){const m=val('fr-msg'),email=val('fr-email');if(m.length<3||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return;
  const thanks=()=>{panel.innerHTML=`<div><h2>Thank you</h2><p class="note">${rkind==='error'?'An editor will check it and correct the book if needed.':'It’s with the editors.'}${' If we have a question, we’ll reply to '+esc(email)+'.'}</p><div class="acts"><button type="button" class="btn" data-cancel="1">${sel?'Back to the entry':'Back'}</button></div></div>`;if(canEdit)countReports()};
  if(val('fr-web'))return thanks();
  const btn=document.getElementById('fr-send'),box=document.getElementById('fr-box'),lk=document.getElementById('fr-link');btn.disabled=true;btn.textContent='Sending…';
  const body={kind:rkind,entity_id:rkind==='error'?sel:null,link_id:rkind==='error'&&lk&&lk.value||null,page:location.href.slice(0,500),message:m,name:val('fr-name'),email};
  try{const t=await token().catch(()=>null),h={apikey:SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'};if(t)h.Authorization='Bearer '+t;
    const r=await fetch(`${SB_URL}/rest/v1/reports`,{method:'POST',headers:h,body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status+' '+await r.text());thanks()}
  catch(e){box.hidden=false;box.textContent=/reports_rate_limit/.test(e.message)?'We’re getting a lot of reports right now. Please try again later, or email editor@darkbluebook.com.':'That didn’t send. Please try again, or email editor@darkbluebook.com.';btn.disabled=false;btn.textContent='Send'}}
async function apiGet(path){const t=await token();if(!t)throw new Error('401 not signed in');
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+t}});if(!r.ok)throw new Error(r.status+' '+await r.text());return r.json()}
async function countReports(){try{openReports=(await apiGet('reports?select=id&status=eq.open')).length}catch(e){openReports=0}}
async function openReportList(){panel.innerHTML='<p class="note">Loading reports…</p>';
  try{REPORTS=await apiGet('reports?select=id,kind,entity_id,link_id,page,message,name,email,status,created_at&order=created_at.desc&limit=200'+(showDone?'':'&status=eq.open'));msg=''}
  catch(e){REPORTS=[];msg=/401|403/.test(e.message)?'Sign in as an editor to see reports.':'Reports could not be loaded. '+e.message.slice(0,120)}
  await countReports();mode='reports';render()}
function listReports(){const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const item=r=>{const e=r.entity_id&&E.get(r.entity_id),l=r.link_id&&L.find(x=>x.id===r.link_id);
    const about=e?`<button type="button" class="ent" data-go="${esc(e.id)}">${esc(e.name)}</button>${l?` <span class="role">link: ${esc(linkLabel(l,''))}</span>`:r.link_id?' <span class="role">link since deleted</span>':''}`
      :r.kind==='error'?'<span class="role">Entry since deleted</span>':'<strong>General feedback</strong>';

    return`<li class="rep${r.status==='done'?' past':''}"><div class="rl">${about}</div><div class="meta"><span>${r.kind==='error'?'Error report':'Feedback'} \u00b7 ${fmt(r.created_at)}${r.status==='done'?' \u00b7 done':''}</span><span>${from}</span></div>

async function setReport(id,status){try{await api('PATCH','reports?id=eq.'+encodeURIComponent(id),status==='done'?{status,resolved_at:new Date().toISOString(),resolved_by:uid||null}:{status,resolved_at:null,resolved_by:null});await openReportList()}

  const j=document.createElement('canvas');j.width=cw;j.height=ch;const jx=j.getContext('2d');jx.fillStyle='#fff';jx.fillRect(0,0,cw,ch);jx.drawImage(c,0,0);
  const jpg=await new Promise(r=>j.toBlob(r,'image/jpeg',.88));if(jpg&&jpg.size<=290000)return{blob:jpg,ext:'jpg',type:'image/jpeg'};throw new Error('too_big')}

const COMBO_TYPES={};
function combo(id,cur,types,placeholder){COMBO_TYPES[id]=types||null;const e=cur&&E.get(cur);
  return`<div class="combo"><input type="hidden" id="${id}" value="${esc(e?e.id:'')}"><input id="${id}-q" class="combo-q" data-combo="${id}" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder||'Type to search the book')}" value="${esc(comboLabel(e))}" role="combobox" aria-expanded="false" aria-controls="${id}-list"><ul class="combo-list" id="${id}-list" role="listbox" hidden></ul></div>`}
const fold=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function comboFind(q,types,max=8){const f=fold(q);if(!f)return[];const qt=f.split(' ');
  const out=[];for(const e of E.values()){if(types&&!types.includes(e.type))continue;const n=fold(e.name),nt=n.split(' ');
    const words=qt.every(t=>nt.some(w=>w.startsWith(t))),squash=n.replace(/ /g,'').includes(f.replace(/ /g,'')),
      initials=qt.length===1&&f.length>=2&&nt.map(w=>w[0]).join('').startsWith(f);
    if(!words&&!squash&&!initials)continue;
    out.push({e,s:(n===f?0:n.startsWith(f)?1:words&&nt[0].startsWith(qt[0])?2:words?3:initials?3.5:4)+e.name.length/1000})}
  return out.sort((a,b)=>a.s-b.s).slice(0,max).map(x=>x.e)}
